<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Instituto Evolução — Centro multidisciplinar de saúde de alto padrão em Limeira, SP."/>
  <title>Instituto Evolução | Saúde Integral de Alto Padrão — Limeira, SP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* ===== REVEAL ANIMATION ===== */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== FORM ===== */
    .form-group { margin-bottom: 1.25rem; }
    .form-group label {
      display: block; font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--gray-light); margin-bottom: 0.5rem;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius); padding: 14px 18px;
      color: var(--white); font-family: var(--font-sans);
      font-size: 0.95rem; transition: var(--transition); outline: none;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--gold);
      background: rgba(201,169,110,0.04);
    }
    .form-group input::placeholder,
    .form-group textarea::placeholder { color: var(--gray); }
    .form-group select option { background: var(--dark-3); color: var(--white); }
    .form-group textarea { resize: vertical; min-height: 100px; }

    /* ===== HERO ===== */
    #hero {
      min-height: 100vh; display: flex; align-items: center;
      position: relative; overflow: hidden;
      background: var(--dark); padding-top: 72px;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 70% 40%, rgba(201,169,110,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 20% 80%, rgba(201,169,110,0.04) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-grid-lines {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(201,169,110,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,169,110,0.035) 1px, transparent 1px);
      background-size: 60px 60px; pointer-events: none;
    }
    .hero-content { position: relative; z-index: 2; max-width: 760px; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 18px; border: 1px solid rgba(201,169,110,0.3);
      border-radius: 50px; font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold);
      background: rgba(201,169,110,0.07); margin-bottom: 2rem;
    }
    .hero-badge::before {
      content: ''; width: 6px; height: 6px; background: #22c55e;
      border-radius: 50%; animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.5; transform:scale(1.4); }
    }
    .hero-title {
      font-size: clamp(2.6rem, 5vw, 4.2rem); font-family: var(--font-serif);
      color: var(--white); line-height: 1.1; margin-bottom: 1.5rem;
    }
    .hero-title em { font-style: italic; color: var(--gold); }
    .hero-desc {
      font-size: 1.1rem; color: rgba(255,255,255,0.65);
      max-width: 540px; line-height: 1.75; margin-bottom: 2.5rem;
    }
    .hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 3.5rem; }
    .hero-stats {
      display: flex; gap: 3rem; flex-wrap: wrap;
      padding-top: 2.5rem; border-top: 1px solid rgba(255,255,255,0.08);
    }
    .hero-stat-value {
      font-family: var(--font-serif); font-size: 2rem; color: var(--gold); line-height: 1;
    }
    .hero-stat-label { font-size: 0.78rem; color: var(--gray); margin-top: 4px; }
    .hero-scroll {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gray);
    }
    .hero-scroll-line {
      width: 1px; height: 40px;
      background: linear-gradient(180deg, var(--gold), transparent);
      animation: scrollLine 2s ease infinite;
    }
    @keyframes scrollLine {
      0%,100% { opacity:1; transform:scaleY(1); }
      50%      { opacity:0.4; transform:scaleY(0.6); }
    }

    /* ===== PROCESSO ===== */
    #processo { background: var(--dark-2); }
    .process-grid {
      display: grid; grid-template-columns: repeat(4,1fr);
      gap: 1.5rem; margin-top: 3rem;
    }
    .process-card {
      background: var(--dark-3); border: 1px solid rgba(201,169,110,0.1);
      border-radius: var(--radius-lg); padding: 2rem; transition: var(--transition);
    }
    .process-card:hover { border-color: rgba(201,169,110,0.3); transform: translateY(-4px); }
    .process-num {
      font-family: var(--font-serif); font-size: 3rem;
      color: rgba(201,169,110,0.15); line-height: 1; margin-bottom: 1rem;
    }
    .process-card h3 { font-size: 1rem; color: var(--white); margin-bottom: 0.5rem; }
    .process-card p  { font-size: 0.85rem; color: var(--gray); line-height: 1.7; margin: 0; }

    /* ===== INSTITUTO ===== */
    #instituto { background: var(--dark); }
    .instituto-layout {
      display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: center;
    }
    .instituto-text p {
      font-size: 0.97rem; color: rgba(255,255,255,0.7); line-height: 1.9; margin-bottom: 1.5rem;
    }
    .instituto-quote {
      font-family: var(--font-serif); font-style: italic; font-size: 1.15rem; color: var(--gold);
      border-left: 2px solid var(--gold); padding-left: 1.5rem; margin: 2rem 0; line-height: 1.65;
    }
    .instituto-pillars { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 2rem; }
    .pillar {
      background: var(--dark-3); border: 1px solid rgba(201,169,110,0.1);
      border-radius: var(--radius); padding: 1.25rem; transition: var(--transition);
    }
    .pillar:hover { border-color: rgba(201,169,110,0.3); }
    .pillar h4 { font-size: 0.85rem; color: var(--white); margin-bottom: 0.3rem; }
    .pillar p  { font-size: 0.78rem; color: var(--gray); line-height: 1.6; margin: 0; }
    .instituto-visual {
      background: linear-gradient(135deg, var(--dark-3), var(--dark-4));
      border: 1px solid rgba(201,169,110,0.15); border-radius: var(--radius-lg);
      aspect-ratio: 4/5; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
      font-size: 5rem; position: relative;
    }
    .instituto-visual-label {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--gold);
    }
    .instituto-tag {
      position: absolute; bottom: -1rem; right: -1rem;
      background: var(--gold); color: var(--dark);
      padding: 0.85rem 1.25rem; border-radius: var(--radius);
      font-size: 0.8rem; font-weight: 700; text-align: center; line-height: 1.35;
    }

    /* ===== HISTÓRIA ===== */
    #historia { background: var(--dark-2); }
    .historia-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: start; }
    .historia-timeline { display: flex; flex-direction: column; gap: 2rem; }
    .timeline-item { display: flex; gap: 1.5rem; }
    .timeline-dot { display: flex; flex-direction: column; align-items: center; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
    .dot-line { width: 1px; flex: 1; min-height: 40px; background: linear-gradient(180deg, var(--gold), transparent); }
    .timeline-content h4 {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 0.35rem;
    }
    .timeline-content h3 { font-size: 1rem; color: var(--white); margin-bottom: 0.5rem; }
    .timeline-content p  { font-size: 0.85rem; color: var(--gray); line-height: 1.7; margin: 0; }
    .historia-text p {
      font-size: 0.97rem; color: rgba(255,255,255,0.7); line-height: 1.9; margin-bottom: 1.5rem;
    }
    .historia-quote {
      font-family: var(--font-serif); font-style: italic; font-size: 1.05rem; color: var(--gold);
      border-left: 2px solid var(--gold); padding-left: 1.5rem; margin: 2rem 0; line-height: 1.65;
    }
    .historia-diffs { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 2rem; }
    .historia-diff {
      background: var(--dark-3); border: 1px solid rgba(201,169,110,0.1);
      border-radius: var(--radius); padding: 1.25rem; transition: var(--transition);
    }
    .historia-diff:hover { border-color: rgba(201,169,110,0.3); }
    .historia-diff h4 { font-size: 0.85rem; color: var(--gold); margin-bottom: 0.3rem; }
    .historia-diff p  { font-size: 0.78rem; color: var(--gray); line-height: 1.6; margin: 0; }

    /* ===== EQUIPE ===== */
    #equipe { background: var(--dark); }
    .equipe-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 2rem; margin-top: 3rem; }
    .equipe-card {
      background: var(--dark-3); border: 1px solid rgba(201,169,110,0.1);
      border-radius: var(--radius-lg); overflow: hidden; transition: var(--transition);
    }
    .equipe-card:hover { border-color: rgba(201,169,110,0.3); transform: translateY(-5px); }
    .equipe-photo {
      aspect-ratio: 3/2; background: linear-gradient(135deg, var(--dark-4), var(--dark-3));
      display: flex; align-items: center; justify-content: center; font-size: 3rem;
      border-bottom: 1px solid rgba(201,169,110,0.1); position: relative;
    }
    .equipe-photo-label {
      position: absolute; bottom: 0.75rem; left: 50%; transform: translateX(-50%);
      font-size: 0.65rem; color: rgba(201,169,110,0.4);
      letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
    }
    .equipe-body { padding: 1.75rem; }
    .equipe-specialty {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem;
    }
    .equipe-body h3 { font-size: 1.05rem; color: var(--white); margin-bottom: 0.2rem; }
    .equipe-role { font-size: 0.8rem; color: var(--gray); margin-bottom: 1rem; }
    .equipe-body p  { font-size: 0.83rem; color: rgba(255,255,255,0.6); line-height: 1.7; margin-bottom: 1rem; }
    .equipe-creds { display: flex; flex-direction: column; gap: 0.3rem; }
    .equipe-cred { font-size: 0.75rem; color: var(--gray); display: flex; align-items: center; gap: 6px; }
    .equipe-cred::before { content: '·'; color: var(--gold); }
    .equipe-together {
      background: var(--dark-3); border: 1px solid rgba(201,169,110,0.12);
      border-radius: var(--radius-lg); padding: 2.5rem;
      display: grid; grid-template-columns: 1fr 1fr; gap: 3rem;
      align-items: center; margin-top: 3rem;
    }
    .equipe-together h3 { font-size: 1.3rem; color: var(--white); margin-bottom: 1rem; }
    .equipe-together p  { font-size: 0.9rem; color: var(--gray); line-height: 1.75; }
    .equipe-together-icons { display: flex; gap: 1rem; font-size: 2rem; justify-content: center; }

    /* ===== METODOLOGIA ===== */
    #metodologia { background: var(--dark-2); }
    .metodo-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 1.5rem; margin-top: 3rem; }
    .metodo-card {
      background: var(--dark-3); border: 1px solid rgba(201,169,110,0.1);
      border-radius: var(--radius-lg); padding: 2rem; transition: var(--transition);
    }
    .metodo-card:hover { border-color: rgba(201,169,110,0.3); transform: translateY(-4px); }
    .metodo-num {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(201,169,110,0.4); margin-bottom: 0.75rem;
    }
    .metodo-card h3 { font-size: 1rem; color: var(--white); margin-bottom: 0.75rem; }
    .metodo-card p  { font-size: 0.83rem; color: var(--gray); line-height: 1.7; margin-bottom: 1rem; }
    .metodo-tag {
      display: inline-block; font-size: 0.7rem; color: var(--gold);
      background: rgba(201,169,110,0.08); border: 1px solid rgba(201,169,110,0.2);
      padding: 4px 10px; border-radius: 50px;
    }
    .vs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2rem; }
    .vs-box {
      background: var(--dark-3); border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-lg); padding: 2rem;
    }
    .vs-box.highlight { border-color: rgba(201,169,110,0.25); }
    .vs-title {
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .vs-title.bad  { color: var(--gray); }
    .vs-title.good { color: var(--gold); }
    .vs-item {
      display: flex; align-items: flex-start; gap: 10px; font-size: 0.85rem;
      color: rgba(255,255,255,0.65); padding: 0.65rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.04); line-height: 1.5;
    }
    .vs-item:last-child { border-bottom: none; }
    .vs-item .icon { flex-shrink: 0; }
    .vs-item .icon.bad  { color: #f87171; }
    .vs-item .icon.good { color: #22c55e; }

    /* ===== AMBIENTE ===== */
    #ambiente { background: var(--dark); }
    .ambiente-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.5rem; margin-top: 3rem; }
    .ambiente-item {
      border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--dark-3), var(--dark-4));
      border: 1px solid rgba(201,169,110,0.1); aspect-ratio: 4/3;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.5rem; transition: var(--transition);
    }
    .ambiente-item:hover { border-color: rgba(201,169,110,0.3); }
    .ambiente-item span { font-size: 2.5rem; }
    .ambiente-item-label {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(201,169,110,0.5);
    }
    .ambiente-item-sub { font-size: 0.72rem; color: var(--gray); }
    .ambiente-features {
      display: grid; grid-template-columns: repeat(4,1fr); gap: 1rem; margin-top: 2.5rem;
    }
    .ambiente-feat {
      text-align: center; padding: 1.25rem;
      background: var(--dark-3); border: 1px solid rgba(201,169,110,0.08);
      border-radius: var(--radius); font-size: 0.82rem; color: var(--gray-light);
      transition: var(--transition);
    }
    .ambiente-feat:hover { border-color: rgba(201,169,110,0.25); }
    .ambiente-feat span { display: block; font-size: 1.5rem; margin-bottom: 0.5rem; }

    /* ===== ESPECIALIDADES ===== */
    #especialidades { background: var(--dark-2); }
